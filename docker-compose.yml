# One command for the whole stack:  docker compose up --build
# Demo extras:
#   docker compose stop saas-1          # kill a replica; collectors keep delivering
#   docker compose --profile demo run --rm simulator
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
      POSTGRES_DB: signal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal"]
      interval: 3s
      timeout: 3s
      retries: 10

  saas-1: &saas
    build: {context: ., dockerfile: saas/Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg2://signal:signal@postgres:5432/signal
      REPLICA_ID: "1"
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]

  saas-2:
    <<: *saas
    environment:
      DATABASE_URL: postgresql+psycopg2://signal:signal@postgres:5432/signal
      REPLICA_ID: "2"
    ports: ["8001:8000"]

  lb:
    image: nginx:alpine
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [saas-1, saas-2]
    ports: ["8080:80"]

  collector:
    build: {context: ., dockerfile: collector/Dockerfile}
    environment:
      COLLECTOR_ID: col-blr-01
      TENANT_REF: t-acme
      REGION: in
      COLLECTOR_KEY: key-acme-1
      COLLECTOR_SECRET: dev-secret-acme
      SAAS_URL: http://lb:80
    volumes: ["collector-data:/data"]
    depends_on: [lb]
    ports: ["8101:8101"]

  simulator:
    image: python:3.11-slim
    profiles: ["demo"]
    working_dir: /sim
    volumes: ["./simulator:/sim:ro"]
    command: ["python", "generator.py", "--url", "http://collector:8101/ingest", "--seconds", "60"]
    depends_on: [collector]

  dashboard:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./dashboard:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_SAAS_URL: http://localhost:8080
    ports: ["5173:5173"]

volumes:
  collector-data:
