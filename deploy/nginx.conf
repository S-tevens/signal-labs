# Single load-balanced SaaS URL. If one replica dies, requests go to the other.
# Dev compose serves plain HTTP; production terminates TLS here (mTLS recommended).
upstream saas {
    server saas-1:8000 max_fails=1 fail_timeout=5s;
    server saas-2:8000 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;

    location / {
        proxy_pass http://saas;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
