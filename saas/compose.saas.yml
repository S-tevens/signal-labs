# Standalone Member B demo. Member C owns the root compose and load balancer.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: signal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d signal']
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    environment:
      ADMIN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/signal
      SAAS_DB_PASSWORD: ${SAAS_DB_PASSWORD:?Set SAAS_DB_PASSWORD}
    command: [python, -m, saas.migrate]
    depends_on:
      postgres: {condition: service_healthy}
  saas-1: &replica
    build: .
    environment: &app_env
      DATABASE_URL: postgresql://signal_app:${SAAS_DB_PASSWORD}@postgres:5432/signal
      SAAS_AUTH_JSON: ${SAAS_AUTH_JSON:?Set SAAS_AUTH_JSON}
      REGION: in
      REPLICA_ID: '1'
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/healthz", timeout=4)']
      interval: 5s
      timeout: 5s
      retries: 10
  saas-2:
    <<: *replica
    environment:
      <<: *app_env
      REPLICA_ID: '2'
    ports: ['127.0.0.1:8001:8000']
volumes:
  pgdata:
