# How incoming records map onto Signal Labs. Edit this file when the stream's field names, units or time format differ.
# Matching is case-insensitive. Fields not listed here are dropped before anything else happens.

host_fields: [host, hostname, node, instance, device, server, source, agent, host.name, host.hostname, agent.hostname, agent.name, resource.host.name, resource.attributes.host.name, labels.host, tags.host, kubernetes.node.name]
name_fields: [metric, name, metric_name, measurement, type, check]
value_fields: [value, val, reading, v, result]
time_fields: [ts, timestamp, time, "@timestamp", datetime, event_time, date]
message_fields: [message, msg, log, text, description]

# Tried in order after ISO-8601 and epoch numbers (seconds, milliseconds, microseconds or nanoseconds) are ruled out.
# Times without a zone are taken as UTC.
timestamp_formats:
  - "%Y-%m-%d %H:%M:%S"
  - "%Y-%m-%d %H:%M:%S.%f"
  - "%d/%m/%Y %H:%M:%S"
  - "%m/%d/%Y %H:%M:%S"
  - "%d-%b-%Y %H:%M:%S"
  - "%Y%m%dT%H%M%S"

# alias -> one of our metric names, with an optional unit conversion: value * scale + offset.
# Our own names (cpu_pct, mem_pct, disk_pct, bandwidth_mbps, latency_ms, packet_loss_pct, service_up, connectivity_up)
# always map to themselves.
metrics:
  # Elastic / Metricbeat (ECS) fields, ratios 0..1 converted to percent
  system.cpu.total.pct: {name: cpu_pct, scale: 100}
  system.memory.actual.used.pct: {name: mem_pct, scale: 100}
  system.memory.used.pct: {name: mem_pct, scale: 100}
  system.filesystem.used.pct: {name: disk_pct, scale: 100}
  # Telegraf / Datadog style names
  usage_user: cpu_pct
  used_percent: mem_pct
  system.cpu.user: cpu_pct
  system.mem.pct_usable: {name: mem_pct, scale: -100, offset: 100}
  # common latency and loss names
  http.server.duration: latency_ms
  ping_average_response_ms: latency_ms
  percent_packet_loss: packet_loss_pct
  cpu: cpu_pct
  cpu_percent: cpu_pct
  cpu_usage: cpu_pct
  cpu_ratio: {name: cpu_pct, scale: 100}
  cpu_idle_pct: {name: cpu_pct, scale: -1, offset: 100}
  mem: mem_pct
  memory: mem_pct
  memory_percent: mem_pct
  mem_used_pct: mem_pct
  mem_ratio: {name: mem_pct, scale: 100}
  mem_free_pct: {name: mem_pct, scale: -1, offset: 100}
  disk: disk_pct
  disk_percent: disk_pct
  disk_used_pct: disk_pct
  disk_ratio: {name: disk_pct, scale: 100}
  bandwidth: bandwidth_mbps
  bandwidth_mbit: bandwidth_mbps
  bandwidth_kbps: {name: bandwidth_mbps, scale: 0.001}
  bandwidth_bps: {name: bandwidth_mbps, scale: 0.000001}
  net_mbps: bandwidth_mbps
  latency: latency_ms
  latency_s: {name: latency_ms, scale: 1000}
  latency_us: {name: latency_ms, scale: 0.001}
  rtt_ms: latency_ms
  packet_loss: packet_loss_pct
  loss_pct: packet_loss_pct
  packet_loss_ratio: {name: packet_loss_pct, scale: 100}
  up: service_up
  service_status: service_up
  alive: service_up
  reachable: connectivity_up
