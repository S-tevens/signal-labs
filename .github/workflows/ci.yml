name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: signal_in
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci-only-password
      SAAS_DB_PASSWORD: ci-only-app-password
      TEST_DATABASE_URL: postgresql://signal_app:ci-only-app-password@localhost:5432/signal_in
      TEST_DATABASE_URL_EU: postgresql://signal_app:ci-only-app-password@localhost:5432/signal_eu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: dashboard/package-lock.json}
      - run: pip install -r collector/requirements.txt -r saas/requirements.txt
      - run: createdb -h localhost -U postgres signal_eu
      - run: python -m saas.migrate
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/signal_in
      - run: python -m saas.migrate
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/signal_eu
      - run: python -m pytest collector saas -q
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
